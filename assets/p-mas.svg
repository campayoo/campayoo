<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 230" width="590" height="230" role="img" aria-label="Todos mis repositorios" xmlns:c2pa="http://c2pa.org/manifest"><defs><linearGradient id="or" x1="0" x2="1"><stop offset="0" stop-color="#ffc24a"/><stop offset="1" stop-color="#ff6a1a"/></linearGradient>
<linearGradient id="cr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf9"/><stop offset="1" stop-color="#fff0dd"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8a4a12" flood-opacity=".16"/></filter></defs><style>
.h{font:900 26px 'Segoe UI',Nunito,Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#2b1a0d} .h2{font:900 21px 'Segoe UI',Nunito,Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#2b1a0d} .b{font:800 17px 'Segoe UI',Nunito,Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#5e4330} .s{font:700 15px 'Segoe UI',Nunito,Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#9a7a62}
