<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 125" width="1200" height="125" role="img" aria-label="EGG WARS: online, bots con A*, anti-trampas, 16 mapas, 225 pruebas" xmlns:c2pa="http://c2pa.org/manifest"><defs><linearGradient id="or" x1="0" x2="1"><stop offset="0" stop-color="#ffc24a"/><stop offset="1" stop-color="#ff6a1a"/></linearGradient>
